package:
  name: php-frankenphp-8.2-ssh2
  version: 1.6.0
  epoch: 0
  description: "Bindings for the libssh2 library"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-frankenphp-8.2

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - libssh2-dev
      - php-frankenphp-8.2
      - php-frankenphp-8.2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php/pecl-networking-ssh2
      tag: "${{package.version}}"
      expected-commit: 4b8098d6efc1b41fb66cb04495926e92ed84ba3b

  - name: Prepare build
    runs: phpize

  - name: Build
    runs: ./configure

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=ssh2.so" > "${{targets.subpkgdir}}/etc/php/conf.d/ssh2.ini"

update:
  enabled: true
  github:
    identifier: php/pecl-networking-ssh2
    use-tag: true
    tag-filter-prefix: 1.
