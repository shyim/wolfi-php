package:
  name: php-frankenphp-8.4-uv
  version: 0.3.1
  epoch: 0
  description: "Interface to libuv for php"
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-frankenphp-8.4

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - libuv-dev
      - php-frankenphp-8.4
      - php-frankenphp-8.4-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/amphp/ext-uv
      tag: "v${{package.version}}"
      expected-commit: e56d640371a5d99eea2e9437cf4739c82e82d99e

  - name: Prepare build
    runs: phpize

  - name: Build
    runs: |
      set -x
      ./configure

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=uv.so" > "${{targets.subpkgdir}}/etc/php/conf.d/uv.ini"

update:
  enabled: true
  github:
    identifier: amphp/ext-uv
    strip-prefix: v
    tag-filter: v
    use-tag: true
