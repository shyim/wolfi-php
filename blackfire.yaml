package:
  name: blackfire
  version: 2026.10.0
  epoch: 0
  description: "Blackfire CLI"
  copyright:
    - license: PROPRIETARY
  options:
    no-provides: true

environment:
  contents:
    packages:
      - bash
      - busybox
      - curl

pipeline:
  - uses: fetch
    if: ${{build.arch}} == 'x86_64'
    with:
      uri: https://blackfire.io/api/v1/releases/cli/linux/x86_64
      expected-sha512: c88375323719c2de833c9f565f86e872fd3a03c67bfbe85b179ae627ca31733a99dc0ab13b1b122e307476745e178be53b2da78c7cada3ef0230dd25ff4785ab

  - uses: fetch
    if: ${{build.arch}} == 'aarch64'
    with:
      uri: https://blackfire.io/api/v1/releases/cli/linux/aarch64
      expected-sha512: 7764203cc41078bfe6f25e9a8689522e61dbcb7390a04831988a3ac5f150d0844380ada384dd650972bfad97d856ff73112412acd1c07bbe07452e03f9814550

  - runs: |
      tar xfv ${{build.arch}}
      mkdir -p ${{targets.destdir}}/usr/bin
      mv blackfire ${{targets.destdir}}/usr/bin/

update:
  enabled: true
  release-monitor:
    identifier: 372834

test:
  pipeline:
    - runs: |
        blackfire version
